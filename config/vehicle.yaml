vehicle:
  # This gate is independent of transport.enabled and defaults safe.
  control_enabled: false
  initial_mode: IDLE
  default_speed_mm_s: 0
  line_follow_speed_mm_s: 0
  speed_limit_mm_s: 0
  default_valid_for_ms: 200
  heartbeat_hz: 20
  vision_timeout_ms: 500
  link_timeout_ms: 500
  stop_hold_ms: 1000
  slow_speed_limit_mm_s: 100
  capture:
    # Enables capture-target semantics only; it does not enable real transport or car control.
    enabled: false
    control_mode: RDK_MOTION_TARGET
    target_timeout_ms: 200
    feedback:
      enabled: false
      type: none             # none / hall / current / switch / vision
      timeout_ms: 800
    no_feedback_policy:
      result: CAPTURE_ATTEMPTED
      post_capture_action: HOLD
      magnet_max_hold_ms: 3000

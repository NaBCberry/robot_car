vehicle:
  # Allow the MSPM0 to execute valid semantic motion commands.
  control_enabled: true
  initial_mode: IDLE
  default_valid_for_ms: 200
  heartbeat_hz: 20
  vision_timeout_ms: 500
  link_timeout_ms: 500
  stop_hold_ms: 1000
  capture:
    # Enables polar capture-target semantics only; it does not enable real transport or car control.
    enabled: false
    # Send valid polar coordinates while forcing enabled=0 at the UART gateway.
    output_only: false
    target_timeout_ms: 200
    feedback:
      enabled: false
      type: none             # none / hall / current / switch / vision
      timeout_ms: 800
    no_feedback_policy:
      result: CAPTURE_ATTEMPTED
      post_capture_action: HOLD
      magnet_max_hold_ms: 3000
  balance:
    # Top-view roller-balance state. The MSPM0 owns the high-rate rocker PID.
    enabled: true
    # Permit fresh balance states to set enabled=1 at the UART gateway.
    output_only: false
    # M0 currently receives only; visual-state timeout still sends a safe frame.
    require_feedback: false
    state_timeout_ms: 120
  roller_home:
    # Keep false until this process is the only Y42 CAN controller.
    # ACTION_REQUEST action_id=1 is rejected unless this and roller_control.yaml enabled are true.
    enabled: false
    timeout_ms: 30000
  status_led:
    # Eight WS2812 pixels on SPI1 MOSI (40-pin header pin 19), reserved for status only.
    enabled: true
    device: /dev/spidev1.0
    count: 8
    brightness: 0.10       # Visible status level; never exceed 10% from this controller.
    refresh_hz: 8
  actions:
    # Requests are accepted from UART and TUI, then pass through the safety watchdogs.
    enabled: true
    default_timeout_ms: 30000

runtime:
  root: /userdata/robot-car
  log_level: INFO
  vision_socket: /userdata/robot-car/runtime/vision.sock

web:
  enabled: true
  host: 192.168.31.93
  port: 8090
  # Ceiling only: actual FPS is limited by camera delivery and JPEG encoding.
  preview_fps: 60
  # Disable after camera calibration: this endpoint can rewrite camera.yaml.
  calibration_enabled: true

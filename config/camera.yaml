camera:
  enabled: true
  device: /dev/video0
  width: 1280
  height: 720
  # This camera supports 1280x720 MJPG at 60 fps.  MJPG must be negotiated first
  # in CameraCapture; uncompressed 720p modes commonly fall back to 15 fps.
  fps: 60
  pixel_format: MJPG
  test_image: ''
  reconnect_delay_ms: 1000
  calibration:
    image_to_capture_homography:
    - 0.0
    - -1.5
    - 1200.0
    - 1.2
    - 0.0
    - -768.0
    - 0.0
    - 0.0
    - 1.0
    roller_balance:
      roi_xyxy:
      - 68.84
      - 296.59
      - 1209.56
      - 384.24
      center_x_px: 625.99
      mm_per_pixel: 0.219161
      axis_direction: 1

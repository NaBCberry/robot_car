transport:
  enabled: true
  type: uart
  # Controls protocol HEARTBEAT frames only; CMD_MOTION is still sent on schedule.
  heartbeat:
    enabled: false
  uart:
    device: "/dev/ttyS1"
    baudrate: 115200
    read_timeout_ms: 20
  can:
    interface: ""
    channel: ""
    bitrate: 500000
    ids:
      command: null
      telemetry: null

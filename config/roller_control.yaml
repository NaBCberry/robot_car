# Separate direct-CAN chain.  Existing UART BALANCE_ROLLER output is unaffected.
# Keep false until the I2C sensor, motor direction, limits, and both calibration tables are verified.
enabled: true
target_mm: 0
# Vision events can occasionally span more than one inference interval; do not stop the
# motor for a single delayed frame while keeping loss-of-vision protection bounded.
state_timeout_ms: 300

imu:
  transport: i2c
  i2c_bus: 0
  i2c_address: 0x69
  # I2C standard-mode/fast-mode clock; lower to 100000 if wiring is long or noisy.
  speed_hz: 400000
  # The module z axis is along the pipe; y is upward when the pipe is level.
  slope_accel_axis: z
  gravity_accel_axis: y
  gyro_axis: x
  slope_accel_sign: 1
  gravity_accel_sign: 1
  gyro_sign: 1
  # Set this to the raw pitch reported while the pipe is at its mechanical zero.
  pitch_zero_offset_deg: 1.799
  # Set this to the selected gyro-axis average while the pipe is stationary.
  gyro_bias_raw: 147.010
  # Single-axis Mahony PI gravity correction. Ki stays disabled until dynamic tuning.
  mahony_kp: 8.0
  mahony_ki: 0.0
  mahony_integral_limit_dps: 5.0

motor:
  can_interface: can0
  address: 1
  # Verified by read-options (1A): EMM closed-loop firmware.
  firmware: emm
  # Full configuration (42) reports Microstep=0x10: 1.8° motor × 16 = 3200 pulses/revolution.
  pulses_per_revolution: 3200
  packet_gap_ms: 3
  command_hz: 40
  # EMM FD Speed is RPM. 60 RPM allows the full calibrated travel to react in about 0.25 s.
  speed_rpm: 60
  acceleration_rpm_s: 100
  deceleration_rpm_s: 100
  # The prior measurements used X-firmware scaling and must not drive this EMM motor.
  soft_limit_firmware: emm
  soft_limit_min_deg: -33.607
  soft_limit_max_deg: 53.371
  # Display-only ratio: raw Y42 multi-turn degrees / output-shaft degrees.
  position_deg_per_output_deg: 1.0

estimator:
  velocity_alpha: 0.35
  acceleration_alpha: 0.20
  max_gap_ms: 250

control:
  # End-to-end verification: a positive visual position error requires a negative tube tilt.
  tilt_sign: -1
  limits:
    target_min_mm: -115
    target_max_mm: 115
    tube_angle_min_deg: -8
    tube_angle_max_deg: 8
  # Lower outer-loop gain to avoid commanding the full tube angle before the motor catches up.
  position_pid: {kp: 2.0, ki: 0.10, kd: 0.0, output_limit: 55.0, integral_limit: 20.0}
  # Limit requested acceleration while characterizing the motor/pipe delay.
  velocity_pid: {kp: 6.0, ki: 0.0, kd: 0.0, output_limit: 600.0, integral_limit: 200.0}
  # Angle feedback is deliberately limited while the motor response is being characterized.
  angle_pid: {kp: 0.4, ki: 0.0, kd: 0.0, output_limit: 3.0, integral_limit: 10.0}
  feedforward:
    # Disabled until a calibrated vehicle acceleration source is available.
    enabled: false
    source: telemetry
    gain: 0.0
    limit_mm_s2: 0.0
  # Measured static angle needed to hold the ball at each position. Replace zeros after calibration.
  slope_bias_deg_by_position: [[-115, 0], [0, 0], [115, 0]]
  # Measured crank inverse map: pipe angle (deg) -> Y42 absolute motor angle (deg).
  motor_deg_by_tube_angle: [[-6.346, -33.602], [-5.782, -29.987], [-5.281, -26.384], [-4.693, -22.67], [-4.067, -19.1], [-3.396, -15.474], [-2.673, -11.893], [-1.901, -8.3], [-1.109, -4.565], [-0.264, -0.972], [0.627, 2.631], [1.476, 6.229], [2.449, 9.948], [3.371, 13.552], [4.289, 17.139], [5.225, 20.748], [6.175, 24.351], [7.109, 28.065], [7.995, 31.657], [8.838, 35.261], [9.666, 38.842], [10.424, 42.446], [11.152, 46.17], [11.822, 49.774], [12.433, 53.366]]

# Separate direct-CAN chain.  Existing UART BALANCE_ROLLER output is unaffected.
# Keep false until the I2C sensor, motor direction, limits, and both calibration tables are verified.
enabled: true
target_mm: 0
# Vision events can occasionally span more than one inference interval; do not stop the
# motor for a single delayed frame while keeping loss-of-vision protection bounded.
state_timeout_ms: 300

imu:
  transport: i2c
  i2c_bus: 5
  i2c_address: 0x69
  # Linux I2C clock is configured by the board device tree; this field does not change it.
  speed_hz: 400000
  # The module z axis is along the pipe; y is upward when the pipe is level.
  slope_accel_axis: z
  gravity_accel_axis: y
  gyro_axis: x
  slope_accel_sign: 1
  gravity_accel_sign: 1
  gyro_sign: 1
  # Set this to the raw pitch reported while the pipe is at its mechanical zero.
  pitch_zero_offset_deg: 1.422
  # Set this to the selected gyro-axis average while the pipe is stationary.
  gyro_bias_raw: 113.470
  # Single-axis Mahony PI gravity correction. Ki stays disabled until dynamic tuning.
  mahony_kp: 8.0
  mahony_ki: 0.0
  mahony_integral_limit_dps: 5.0

motor:
  can_interface: can0
  address: 1
  # Verified by read-options (1A): EMM closed-loop firmware.
  firmware: emm
  # Full configuration (42) reports Microstep=0x10: 1.8° motor × 16 = 3200 pulses/revolution.
  pulses_per_revolution: 3200
  packet_gap_ms: 3
  command_hz: 40
  # EMM FD Speed is RPM. 60 RPM allows the full calibrated travel to react in about 0.25 s.
  speed_rpm: 60
  acceleration_rpm_s: 100
  deceleration_rpm_s: 100
  # The prior measurements used X-firmware scaling and must not drive this EMM motor.
  soft_limit_firmware: emm
  soft_limit_min_deg: -30.937
  soft_limit_max_deg: 46.120
  # Display-only ratio: raw Y42 multi-turn degrees / output-shaft degrees.
  position_deg_per_output_deg: 1.0

estimator:
  velocity_alpha: 0.35
  acceleration_alpha: 0.20
  max_gap_ms: 250

# Vehicle-motion feedforward for tasks 4-6. Keep disabled until the pipe axis,
# wheel track, and MPU6500 mounting axes have been measured on this vehicle.
vehicle_motion:
  enabled: false
  telemetry_timeout_ms: 150
  # Chassis forward/lateral components of the tube positive direction.
  pipe_axis_in_chassis: [1.0, 0.0]
  # Reverse only after a controlled forward-acceleration sign test.
  pipe_acceleration_sign: 1
  wheel_track_mm: 160.0
  encoder_accel_alpha: 0.35
  imu_accel_correction_gain: 0.20
  imu_yaw_correction_gain: 0.35
  max_acceleration_mm_s2: 3000.0
  mpu6500:
    enabled: false
    i2c_bus: 0
    i2c_address: 0x68
    i2c_retries: 2
    i2c_retry_delay_ms: 2
    # Map sensor axes to chassis forward, lateral, upward after installation.
    forward_axis: x
    lateral_axis: y
    vertical_axis: z
    x_sign: 1
    y_sign: 1
    z_sign: 1
    yaw_gyro_axis: z
    yaw_gyro_sign: 1
    yaw_gyro_bias_deg_s: 0.0
    gravity_time_constant_s: 1.0

control:
  # End-to-end verification: a positive visual position error requires a negative tube tilt.
  tilt_sign: -1
  limits:
    target_min_mm: -115
    target_max_mm: 115
    tube_angle_min_deg: -8
    tube_angle_max_deg: 8
  # Lower outer-loop gain to avoid commanding the full tube angle before the motor catches up.
  position_pid: {kp: 2.0, ki: 0.20, kd: 0.0, output_limit: 55.0, integral_limit: 20.0}
  # Limit requested acceleration while characterizing the motor/pipe delay.
  velocity_pid: {kp: 6.0, ki: 0.0, kd: 0.0, output_limit: 600.0, integral_limit: 200.0}
  # Angle feedback is deliberately limited while the motor response is being characterized.
  angle_pid: {kp: 0.4, ki: 0.0, kd: 0.0, output_limit: 3.0, integral_limit: 10.0}
  feedforward:
    # Disabled until a calibrated vehicle acceleration source is available.
    enabled: true
    source: vehicle_motion
    gain: 0.0
    limit_mm_s2: 0.0
  # Temporary local breakaway compensation around the measured +10 mm equilibrium.
  slope_bias_deg_by_position: [[-115, 0], [0, 0], [10, 0.25], [20, 0], [115, 0]]
  # Measured crank inverse map: pipe angle (deg) -> Y42 absolute motor angle (deg).
  motor_deg_by_tube_angle: [[-5.793, -30.927], [-5.317, -27.664], [-4.793, -24.521], [-4.246, -21.248], [-3.658, -18.116], [-3.067, -14.848], [-2.412, -11.7], [-1.76, -8.432], [-1.106, -5.279], [-0.368, -2.027], [0.38, 1.121], [1.171, 4.395], [1.982, 7.646], [2.804, 10.8], [3.615, 14.073], [4.43, 17.227], [5.263, 20.468], [6.076, 23.621], [6.876, 26.884], [7.67, 30.026], [8.412, 33.311], [9.139, 36.464], [9.85, 39.705], [10.473, 42.88], [11.124, 46.121]]
